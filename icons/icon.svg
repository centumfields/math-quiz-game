<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 수학 연산 퀴즈 앱 아이콘 원본. 기호는 가운데 안전 영역(지름 80%) 안에 두어 마스크로 잘려도 안 깨져요. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c6ef5"/>
      <stop offset="1" stop-color="#364fc7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <g fill="#ffffff" fill-opacity="0.16">
    <rect x="120" y="120" width="116" height="116" rx="24"/>
    <rect x="276" y="120" width="116" height="116" rx="24"/>
    <rect x="120" y="276" width="116" height="116" rx="24"/>
    <rect x="276" y="276" width="116" height="116" rx="24"/>
  </g>
  <g fill="#ffffff">
    <!-- + -->
    <rect x="140" y="169" width="76" height="18" rx="9"/>
    <rect x="169" y="140" width="18" height="76" rx="9"/>
    <!-- − -->
    <rect x="296" y="169" width="76" height="18" rx="9"/>
    <!-- × -->
    <g transform="translate(178 334) rotate(45)">
      <rect x="-38" y="-9" width="76" height="18" rx="9"/>
      <rect x="-9" y="-38" width="18" height="76" rx="9"/>
    </g>
    <!-- ÷ -->
    <rect x="296" y="325" width="76" height="18" rx="9"/>
    <circle cx="334" cy="303" r="11"/>
    <circle cx="334" cy="365" r="11"/>
  </g>
</svg>
